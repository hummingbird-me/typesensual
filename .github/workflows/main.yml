name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} + typesense-ruby ${{ matrix.typesense.gem }} + Typesense ${{ matrix.typesense.server }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '2.7.8'
          - '3.0.6'
          - '3.1.4'
          - '3.2.2'
          - '3.4'
          - '4.0'
        # Pairs follow https://github.com/typesense/typesense-ruby#compatibility
        typesense:
          - { gem: '~> 5.0', server: '30.2' }
          - { gem: '~> 4.0', server: '29.0' }
          - { gem: '~> 3.0', server: '28.0' }
          - { gem: '~> 2.0', server: '27.1' }
          - { gem: '~> 1.0', server: '0.25.2' }
          - { gem: '0.15.0', server: '0.24.1' }
          - { gem: '0.15.0', server: '0.23.1' }
          - { gem: '0.15.0', server: '0.22.1' }

    env:
      TYPESENSE_GEM: ${{ matrix.typesense.gem }}

    services:
      typesense:
        image: typesense/typesense:${{ matrix.typesense.server }}
        ports:
          - 8108:8108
        env:
          TYPESENSE_API_KEY: xyz
          TYPESENSE_DATA_DIR: /data
        volumes:
          - typesense_data:/data

    steps:
    - uses: actions/checkout@v3

    # The lockfile pins one typesense-ruby version; let each job resolve its own
    - run: rm Gemfile.lock

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the test suite
      run: bundle exec rake spec

    - name: Publish code coverage
      uses: paambaati/codeclimate-action@v4.0.0
      continue-on-error: true
      env:
        CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
